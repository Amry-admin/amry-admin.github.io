name: cyclesync
description: "CycleSync: private menstrual cycle and wellness tracker."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.5.0

# Packages are added with `flutter pub add` (see README) so that versions
# are resolved against the installed Flutter SDK and locked in pubspec.lock.
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.3
  intl: ^0.20.3
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
