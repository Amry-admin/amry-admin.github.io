name: Add packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/deps.txt']

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Add packages
        run: |
          pkgs=$(grep -v '^\s*#' .github/deps.txt | grep -v '^\s*$' | tr '\n' ' ')
          flutter pub add $pkgs
          added=$(for p in $pkgs; do grep -E "^  $p: " pubspec.yaml; done | tr -s ' ' | tr '\n' ';')
          echo "::notice title=Pinned packages::$added"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml pubspec.lock
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Add packages: $(grep -v '^\s*#' .github/deps.txt | grep -v '^\s*$' | tr '\n' ' ')"
          git push
